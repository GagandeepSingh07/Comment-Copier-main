<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
    <div class="topbar">
        <div class="tabs" id="main-tabs">
            <button class="tab active" data-tab="comments">Comment Copier</button>
            <button class="tab" data-tab="student">Student Details</button>
        </div>
        <div class="info-wrap">
            <div class="info-popover" id="info-popover">
                <div class="info-head">
                    <img class="info-app-icon" src="build/icon.png" alt="">
                    <div class="info-title-block">
                        <div class="info-name" id="info-name">Comment Copier</div>
                        <div class="info-version" id="info-version"></div>
                    </div>
                </div>
                <div class="info-desc" id="info-desc"></div>

                <button type="button" class="info-section-toggle" data-section="details" aria-expanded="false">
                    <span>Details</span><span class="chevron"></span>
                </button>
                <div class="info-section-body hidden" data-body="details">
                    <div class="info-meta" id="info-meta"></div>
                </div>

                <button type="button" class="info-section-toggle" data-section="shortcuts" aria-expanded="false">
                    <span>Shortcuts</span><span class="chevron"></span>
                </button>
                <div class="info-section-body hidden" data-body="shortcuts">
                    <div class="info-keys">
                        <div class="info-key-row"><span class="info-key">Ctrl+Enter</span><span>Save all edits</span></div>
                        <div class="info-key-row"><span class="info-key">Esc</span><span>Close the popup</span></div>
                    </div>
                </div>

                <button type="button" class="info-section-toggle" data-section="changelog" aria-expanded="false">
                    <span>What&rsquo;s new</span><span class="chevron"></span>
                </button>
                <div class="info-section-body hidden" data-body="changelog">
                    <div class="info-changelog" id="info-changelog"></div>
                </div>

                <button type="button" class="btn-reset" id="info-reset">Reset app data</button>
            </div>
        </div>
    </div>

    <div class="tab-panel active" data-panel="comments">
        <div class="head">
            <span class="head-title">Comment Copier</span>
            <span class="head-total" id="total-count"></span>
        </div>

        <div class="rows" id="rows"></div>

        <div class="sep"></div>

        <div class="editor-head">
            <button class="editor-toggle" id="editor-toggle" title="Show or hide the comment editor">Edit comments</button>
            <div class="editor-head-actions">
                <span class="save-status" id="save-status">All changes saved</span>
                <button class="btn-save" id="save-btn">Save</button>
            </div>
        </div>

        <div class="editor" id="editor">
            <div class="etabs">
                <button class="etab active" data-key="accept">Accept</button>
                <button class="etab" data-key="aireject">AI Reject</button>
                <button class="etab" data-key="copyreject">Copy Reject</button>
                <button class="etab" data-key="prompt">Prompt</button>
            </div>
            <div class="edits">
                <textarea id="accept-text" placeholder="One comment per line"></textarea>
                <textarea id="aireject-text" placeholder="One comment per line"></textarea>
                <textarea id="copyreject-text" placeholder="One comment per line"></textarea>
                <div class="prompt-head" id="prompt-head">
                    <span class="prompt-label">Prompt</span>
                    <span class="save-status" id="prompt-status">Saved</span>
                </div>
                <textarea id="prompt-text" placeholder="Type the prompt to copy with the Prompt button"></textarea>
            </div>
            <div class="editor-add">
                <input id="editor-add-input" placeholder="Add a comment and press Enter">
                <button class="btn-add" id="editor-add-btn">Add</button>
            </div>
            <div class="editor-meta">
                <span class="editor-count" id="editor-count"></span>
                <button class="link" id="editor-restore">Restore defaults</button>
            </div>
        </div>
    </div>

    <div class="tab-panel" data-panel="student">
        <div class="sheet-head">
            <span class="sheet-label">Student details</span>
            <div class="sheet-head-actions">
                <button class="link" id="sheet-paste-btn" title="Copy a range of cells in Excel (Ctrl+C), then click here to import from the clipboard">Paste</button>
                <button class="link" id="sheet-paste-toggle" title="Paste into a text box instead">Paste box</button>
                <button class="link" id="sheet-reset">Clear</button>
            </div>
        </div>
        <div class="sheet-fields">
            <input id="sheet-id" placeholder="Student Id">
            <input id="sheet-name" placeholder="Name">
            <button class="action action-primary" id="sheet-btn" title="Copy the Excel tracking sheet, then paste into Excel">Copy Sheet</button>
        </div>
        <div class="sheet-paste-panel hidden" id="sheet-paste-panel">
            <textarea id="sheet-paste-textarea" placeholder="Paste an Excel table here, or type one code + mark per line, e.g.&#10;CPCCCA3002, Checked&#10;CPCCWHS2001, AI Detected"></textarea>
            <div class="sheet-paste-actions">
                <button class="link" id="sheet-paste-cancel">Cancel</button>
                <button class="btn-add" id="sheet-paste-import-btn">Import</button>
            </div>
        </div>
        <div class="sheet-preview">
            <span class="sheet-label">Unit Code &amp; Mark</span>
            <div class="sheet-add">
                <input id="sheet-add-code" placeholder="Code (e.g. CPCCPD2011)">
                <div class="mark-select" id="mark-select">
                    <button type="button" class="mark-select-trigger" id="mark-select-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="mark-select-dot dot-checked" id="mark-select-dot"></span>
                        <span class="mark-select-value" id="mark-select-value">Checked</span>
                        <svg class="mark-select-chevron" width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z"></path></svg>
                    </button>
                    <div class="mark-select-menu hidden" id="mark-select-menu" role="listbox">
                        <button type="button" class="mark-select-option selected" data-value="Checked" role="option" aria-selected="true">
                            <span class="mark-select-dot dot-checked"></span>Checked
                        </button>
                        <button type="button" class="mark-select-option" data-value="AI Detected" role="option" aria-selected="false">
                            <span class="mark-select-dot dot-ai"></span>AI Detected
                        </button>
                        <button type="button" class="mark-select-option" data-value="Copied" role="option" aria-selected="false">
                            <span class="mark-select-dot dot-copied"></span>Copied
                        </button>
                        <div class="mark-select-sep"></div>
                        <button type="button" class="mark-select-option" data-value="__custom__" role="option" aria-selected="false">
                            <span class="mark-select-dot dot-custom"></span>Type your own
                        </button>
                    </div>
                </div>
                <input id="sheet-add-mark-custom" class="hidden" placeholder="Type a mark">
                <button class="btn-add" id="sheet-add-btn">Add</button>
            </div>
            <div class="sheet-preview-list" id="sheet-preview-list"></div>
        </div>
    </div>

    <div class="actions">
        <button class="action" id="quit">Quit</button>
        <div class="organizer-wrap">
            <button type="button" class="organizer-btn" id="organizer-btn" aria-label="File organizer" aria-haspopup="true" aria-expanded="false" title="Organize files into folders">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 4.25A1 1 0 0 1 3 3.25h3l1.2 1.5h5.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-7.5Z"/></svg>
            </button>
            <div class="organizer-popover" id="organizer-popover">
                <div class="organizer-head">
                    <div class="organizer-head-id">
                        <span class="organizer-head-icon">
                            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4.25A1 1 0 0 1 3 3.25h3l1.2 1.5h5.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-7.5Z"/></svg>
                        </span>
                        <div>
                            <div class="organizer-popover-head">File Organizer</div>
                            <div class="organizer-popover-sub">Sort files into folders by code</div>
                        </div>
                    </div>
                    <button type="button" class="link" id="organizer-clear-btn" title="Clear the selected folder">Clear</button>
                </div>
                <div class="organizer-steps">
                    <span class="organizer-step">
                        <span class="organizer-step-num">1</span>
                        <strong>Browse</strong> a folder
                    </span>
                    <svg class="organizer-step-arrow" width="10" height="8" viewBox="0 0 10 8" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1 4h8M6 1l3 3-3 3"/></svg>
                    <span class="organizer-step">
                        <span class="organizer-step-num">2</span>
                        <strong>Organize</strong> the files
                    </span>
                </div>
                <div class="organizer-folder-row" id="organizer-folder-row">
                    <svg class="organizer-folder-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 4.25A1 1 0 0 1 3 3.25h3l1.2 1.5h5.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-7.5Z"/></svg>
                    <input id="organizer-path" placeholder="No folder selected" readonly>
                    <button type="button" class="btn-add organizer-browse" id="organizer-browse-btn">Browse</button>
                </div>
                <button type="button" class="btn-organize" id="organizer-run-btn" disabled title="Group files into folders named after the code/identifier before the first '-' or space">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 4.25A1 1 0 0 1 3 3.25h3l1.2 1.5h5.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-7.5Z"/><path d="M5.5 9.5h5M8 7v5"/></svg>
                    <span>Organize Files</span>
                </button>
                <div class="organizer-summary" id="organizer-summary"></div>
                <div class="organizer-list" id="organizer-list"></div>
            </div>
        </div>
        <button class="action" id="prompt-btn" title="Copy the File Organization prompt">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.5"/><path d="M4 10H3a1.5 1.5 0 0 1-1.5-1.5v-5A1.5 1.5 0 0 1 3 2h5A1.5 1.5 0 0 1 9.5 3.5V4"/></svg>
        </button>
        <button type="button" class="layout-btn" id="layout-btn" title="Switch to Side by side layout" aria-pressed="false">
            <svg class="icon-tabs" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="12" height="5.5" rx="1"/><rect x="2" y="8.5" width="12" height="5.5" rx="1"/></svg>
            <svg class="icon-columns" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="5.5" height="12" rx="1"/><rect x="8.5" y="2" width="5.5" height="12" rx="1"/></svg>
            <svg class="icon-cards" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>
        </button>
        <button type="button" class="info-btn" id="info-btn" aria-label="App info" aria-haspopup="true" aria-expanded="false">i</button>
    </div>
</div>
<div class="toast" id="toast"></div>
<div class="card-tooltip" id="card-tooltip"></div>
<script src="popup.js"></script>
</body>
</html>
