<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <style>
        :root { color-scheme: light dark; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            user-select: none;
            cursor: crosshair;
            -webkit-user-select: none;
        }
        #overlay {
            position: fixed;
            inset: 0;
        }
        canvas { display: block; }
        #hint {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            background: rgba(13, 17, 23, 0.92);
            color: #e6edf3;
            border: 1px solid rgba(110, 118, 129, 0.5);
            border-radius: 8px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 13px;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        #hint kbd {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
        }
        #size {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            background: rgba(13, 17, 23, 0.85);
            color: #e6edf3;
            border: 1px solid rgba(110, 118, 129, 0.5);
            border-radius: 6px;
            font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
            font-size: 13px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="overlay"><canvas></canvas></div>
    <div id="hint">Drag to select the area &middot; <kbd>Esc</kbd> to cancel</div>
    <div id="size"></div>
    <script src="overlay.js"></script>
</body>
</html>
